<section class="story-achievements story-travel content" id="international-adventures" aria-labelledby="travel-title">
  <div class="story-section-heading"><div><p class="eyebrow">Part of a worldwide movement</p><h2 id="travel-title">Beyond Factreton.</h2><p>Recorded chapters of our group’s international Scouting story.</p></div></div>
  <ol class="story-travel-list" aria-label="Recorded international Scouting milestones">
    <li><p class="story-travel-year"><time datetime="1975">1975</time></p><div><h3>Norway · 14th World Scout Jamboree</h3><p>First Factreton appears in the South African contingent record for the Jamboree at Lillehammer, Norway.</p></div></li>
    <li><p class="story-travel-year"><time datetime="1979">1979</time></p><div><h3>Switzerland · World Jamboree Year</h3><p>Thomas H. Wilson is listed as First Factreton’s Group Scoutmaster in the South African contingent for the camp at Kandersteg. This was part of World Jamboree Year, following the cancellation of the planned Jamboree in Iran.</p></div></li>
    <li><p class="story-travel-year"><time datetime="1983">1983</time></p><div><h3>Canada · 15th World Scout Jamboree</h3><p>Basil Scholtz is listed for First Factreton in the South African contingent to Kananaskis, Alberta, Canada.</p></div></li>
    <li><p class="story-travel-year"><time datetime="1987">1987</time>–<time datetime="1988">88</time></p><div><h3>Australia · 16th World Scout Jamboree</h3><p>Donovan John Storkey is recorded for First Factreton in the South African contingent. The Jamboree at Cataract Scout Park spanned the end of 1987 and the beginning of 1988.</p></div></li>
    <li><p class="story-travel-year"><time datetime="1992">1992</time></p><div><h3>Switzerland · 9th World Rover Moot</h3><p>The South African contingent leader’s report names Victor Stevens at the Moot in Kandersteg. His adventure included building a raft and travelling on the River Aare.</p></div></li>
  </ol>
</section>

e="1992">1992</time><span>15-year long-service medal</span></li></ul></li><li class="story-service-person"><h4>Aubrey Papier</h4><ul><li data-recorded-award="service"><time datetime="2011">2011</time><span>15-year long-service medal</span></li></ul></li><li class="story-service-person"><h4>Johanna Papier</h4><ul><li data-recorded-award="service"><time datetime="2011">2011</time><span>15-year long-service medal</span></li></ul></li><li class="story-service-person"><h4>Maureen Papier</h4><p class="story-service-group">Recorded under 1st Thorn-Ruy</p><ul><li data-recorded-award="service"><time datetime="2007">2007</time><span>5-year service award</span></li><li data-recorded-award="service"><time datetime="2012">2012</time><span>10-year service award</span></li></ul></li><li class="story-service-person"><h4>Ruth Marie Peters</h4><ul><li data-recorded-award="service"><time datetime="1990">1990</time><span>5-year service award</span></li><li data-recorded-award="service"><time datetime="1995">1995</time><span>10-year service award</span></li></ul></li><li class="story-service-person"><h4>Chad Petersen</h4><ul><li data-recorded-award="service"><time datetime="2013">2013</time><span>5-year service award</span></li></ul></li><li class="story-service-person"><h4>Walter Petersen</h4><ul><li data-recorded-award="service"><time datetime="2002">2002</time><span>30-year bar</span></li></ul></li><li class="story-service-person"><h4>Hester Robertson</h4><ul><li data-recorded-award="service"><time datetime="1992">1992</time><span>15-year long-service medal</span></li></ul></li><li class="story-service-person"><h4>F. Rutgers</h4><ul><li data-recorded-award="service"><time datetime="2006">2006</time><span>5-year service award</span></li><li data-recorded-award="service"><time datetime="2011">2011</time><span>10-year service award</span></li></ul></li><li class="story-service-person"><h4>Elizabeth Samuels</h4><ul><li data-recorded-award="service"><time datetime="1994">1994</time><span>30-year bar</span></li></ul></li><li class="story-service-person"><h4>Frank Gregory Samuels</h4><ul><li data-recorded-award="service"><time datetime="1995">1995</time><span>5-year service award</span></li></ul></li><li class="story-service-person"><h4>Victor Stevens</h4><ul><li data-recorded-award="service"><time datetime="2003">2003</time><span>30-year bar</span></li><li data-recorded-award="service"><time datetime="2015">2015</time><span>40-year bar</span></li></ul></li><li class="story-service-person"><h4>Deen Storkey</h4><ul><li data-recorded-award="service"><time datetime="2024">2024</time><span>10-year award</span></li></ul></li><li class="story-service-person"><h4>Donovan Storkey</h4><ul><li data-recorded-award="service"><time datetime="2005">2005</time><span>15-year long-service medal</span></li><li data-recorded-award="service"><time datetime="2015">2015</time><span>30-year bar</span></li></ul></li><li class="story-service-person"><h4>E. Storkey</h4><ul><li data-recorded-award="service"><time datetime="1972">1972</time><span>15-year long-service medal</span></li></ul></li><li class="story-service-person"><h4>Margarette Storkey</h4><ul><li data-recorded-award="service"><time datetime="1994">1994</time><span>15-year long-service medal</span></li></ul></li><li class="story-service-person"><h4>Thomas Henry Wilson</h4><ul><li data-recorded-award="service"><time datetime="1982">1982</time><span>15-year long-service medal</span></li></ul></li></ul><p class="story-award-note">E. Storkey retains the initial used in the public register. F. Rutgers uses a shared initial because the given-name spellings differ between records. These entries do not establish a service start date or uninterrupted years of service.</p></div></details>

<section class="story-achievements story-trophies content" id="trophy-wins" aria-labelledby="trophy-title">
  <div class="story-section-heading"><div><p class="eyebrow">Teamwork worth remembering</p><h2 id="trophy-title">Trophy highlights.</h2><p>A few proud moments from our group’s competition history.</p></div></div>
  <div class="story-trophy-grid">
    <article class="story-trophy-card gallant"><p class="eyebrow">Cubs · Gallant Shield</p><h3>Two winning years.</h3><p class="story-trophy-years"><time datetime="1995">1995</time><span aria-hidden="true"> / </span><time datetime="1996">1996</time></p><p>First Factreton is listed among the Gallant Shield winners in both years.</p></article>
    <article class="story-trophy-card hawkeye"><p class="eyebrow">Rovers · Hawkeye Trophy</p><h3>A shared tradition.</h3><p class="story-trophy-years"><time datetime="1992">1992</time><span aria-hidden="true"> / </span><time datetime="1993">1993</time></p><p>Winners in 1992, followed by a joint win with 1st Sanddrift in 1993.</p></article>
  </div>
  <details class="story-history-sources"><summary>History notes &amp; sources <span aria-hidden="true">+</span></summary><div><p>The founding year, 1952, is confirmed by First Factreton group leadership. The Springbok names, international milestones, adult awards and trophy years above are checked against public Scouting registers, contingent lists, reports and the Western Cape 2024 adult awards programme on 22 October 2026. Names follow the cited records, with the initials noted above retained.</p><ul><li><a href="https://scoutwiki.scouts.org.za/wiki/Springbok_Scouts" target="_blank" rel="noopener noreferrer">Springbok Scout register ↗</a></li><li><a href="https://scoutwiki.scouts.org.za/wiki/Gallant_Shield" target="_blank" rel="noopener noreferrer">Gallant Shield winners ↗</a></li><li><a href="https://scoutwiki.scouts.org.za/wiki/Hawkeye_Trophy" target="_blank" rel="noopener noreferrer">Hawkeye Trophy history and winners ↗</a></li><li><a href="https://scoutwiki.scouts.org.za/wiki/World_Jamborees" target="_blank" rel="noopener noreferrer">World Jamboree history and event chronology ↗</a></li><li><a href="https://scoutwiki.scouts.org.za/wiki/World_Jamborees:_1975_SA_Contingent" target="_blank" rel="noopener noreferrer">1975 Norway · South African contingent ↗</a></li><li><a href="https://scoutwiki.scouts.org.za/wiki/World_Jamboree_Year:_1979_SA_Switzerland_Contingent" target="_blank" rel="noopener noreferrer">1979 Switzerland · South African contingent ↗</a></li><li><a href="https://scoutwiki.scouts.org.za/wiki/World_Jamborees:_1983_SA_Contingent" target="_blank" rel="noopener noreferrer">1983 Canada · South African contingent ↗</a></li><li><a href="https://scoutwiki.scouts.org.za/wiki/World_Jamborees:_1987_SA_Contingent" target="_blank" rel="noopener noreferrer">1987–88 Australia · South African contingent ↗</a></li><li><a href="https://scoutwiki.scouts.org.za/wiki/Rover_World_Moot:_1992_Report" target="_blank" rel="noopener noreferrer">1992 Switzerland · South African Moot report ↗</a></li><li><a href="https://scoutwiki.scouts.org.za/wiki/Merit_Award_recipients" target="_blank" rel="noopener noreferrer">Merit award recipients ↗</a></li><li><a href="https://scoutwiki.scouts.org.za/wiki/Long_Service_Award_recipients" target="_blank" rel="noopener noreferrer">Long-service award recipients ↗</a></li><li><a href="https://westerncape.scouts.org.za/wp-content/uploads/sites/3/2024/05/Adult-Leader-Awards-Programme-2024.pdf#page=3" target="_blank" rel="noopener noreferrer">Western Cape 2024 adult awards programme · page 3 (PDF) ↗</a></li></ul><p>These are recorded milestones, rather than a complete history of every member or award. The Hawkeye results celebrate our Rover history. Please contact the group if you can help with a correction or another documented chapter.</p><a class="inline-link" href="contact.html">Share a piece of our story →</a></div></details>
